name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-quality:
    name: Unit quality and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy app

      - name: Test with coverage
        run: python -m pytest

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dataops_observability
          POSTGRES_USER: dataops
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataops -d dataops_observability"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://dataops:ci_password@127.0.0.1:5432/dataops_observability
      ENVIRONMENT: ci
      RUN_MIGRATIONS_ON_STARTUP: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres]"

      - name: Apply PostgreSQL migrations
        run: |
          alembic upgrade head
          alembic current

      - name: Start API and verify database health
        shell: bash
        run: |
          python scripts/start_api.py > api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; cat api.log' EXIT

          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          health_url = "http://127.0.0.1:8000/health"
          last_error = None
          for _ in range(30):
              try:
                  with urllib.request.urlopen(health_url, timeout=2) as response:
                      payload = json.load(response)
                  assert response.status == 200, response.status
                  assert payload["status"] == "ok", payload
                  assert payload["database"] == "ok", payload
                  break
              except (AssertionError, OSError, urllib.error.URLError) as error:
                  last_error = error
                  time.sleep(1)
          else:
              raise RuntimeError(f"API health check did not pass: {last_error}")
          PY

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --tag dataops-observability-api:ci .

      - name: Verify non-root SQLite startup and health
        shell: bash
        run: |
          image=dataops-observability-api:ci
          container=dataops-observability-api-smoke

          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "10001:10001"
          docker run --detach --name "$container" --publish 127.0.0.1:8000:8000 "$image"
          trap 'docker logs "$container" || true; docker rm --force "$container" >/dev/null 2>&1 || true' EXIT

          for _ in {1..45}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
            if [ "$status" = "healthy" ]; then
              break
            fi
            if [ "$status" = "unhealthy" ]; then
              exit 1
            fi
            sleep 2
          done

          test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = "healthy"
          docker exec "$container" test -w /data
          docker exec "$container" test -s /data/dataops_observability.db

  quality:
    name: quality
    if: always()
    needs:
      - unit-quality
      - postgres-integration
      - docker-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    env:
      UNIT_QUALITY_RESULT: ${{ needs.unit-quality.result }}
      POSTGRES_INTEGRATION_RESULT: ${{ needs.postgres-integration.result }}
      DOCKER_SMOKE_RESULT: ${{ needs.docker-smoke.result }}
    steps:
      - name: Require every CI check to pass
        shell: bash
        run: |
          test "$UNIT_QUALITY_RESULT" = "success"
          test "$POSTGRES_INTEGRATION_RESULT" = "success"
          test "$DOCKER_SMOKE_RESULT" = "success"
